name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: mcp-guard-linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: mcp-guard-macos-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package binary
        run: |
          tar -czf ${{ matrix.asset }} -C target/${{ matrix.target }}/release mcp-guard
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
